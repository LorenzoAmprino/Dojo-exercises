<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .book-cover {
            height: 200px;
            object-fit: contain;
            background-color: #f8f9fa;
            padding: 10px;
        }
        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">Biblioteca Digitale</h1>

        <!-- Search Section -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Cerca Libri</h5>
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Inserisci il titolo del libro...">
                    <button class="btn btn-primary" id="searchButton">Cerca</button>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div class="mb-4" id="searchResultsSection" style="display: none;">
            <h4 class="mb-3">Risultati della Ricerca</h4>
            <div id="searchResults" class="row g-3"></div>
        </div>

        <!-- Favorites Section -->
        <div>
            <h4 class="mb-3">I Miei Preferiti</h4>
            <div id="favoritesList" class="row g-3">
                <div class="col-12">
                    <p class="text-muted">Nessun libro nei preferiti</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Book Details Modal -->
    <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookModalTitle">Dettagli Libro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="bookModalBody">
                    <div class="row">
                        <div class="col-md-4 text-center">
                            <img id="modalBookCover" src="" class="img-fluid mb-3" alt="Copertina">
                        </div>
                        <div class="col-md-8">
                            <h4 id="modalBookTitle"></h4>
                            <p class="text-muted" id="modalBookAuthor"></p>
                            <p id="modalBookDescription">Nessuna descrizione disponibile</p>
                            <p><strong>Anno di pubblicazione:</strong> <span id="modalBookYear"></span></p>
                            <p><strong>Editore:</strong> <span id="modalBookPublisher"></span></p>
                            <p><strong>ISBN:</strong> <span id="modalBookIsbn"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                    <button type="button" class="btn btn-primary" id="addToFavoritesBtn">
                        Aggiungi ai Preferiti
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
